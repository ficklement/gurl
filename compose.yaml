services:
  postgres:
    image: postgres:17
    container_name: gurl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gurl
      POSTGRES_PASSWORD: ${GURL_DB_PASSWORD}
      POSTGRES_DB: gurl
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gurl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gurl -d gurl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gurl_postgres_data:
